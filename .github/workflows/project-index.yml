# Keeps projects/index.txt in sync with the projects/ folder.
#
# GitHub Pages serves no directory listings, so the site needs a manifest of
# which project files exist. The generation is inlined below rather than
# calling a script, because make-index.sh lives in private/ and is not in
# the repo. Add a project, push, and the index updates itself.
#
# Don't want this? Delete this file and run private/make-index.sh yourself
# before pushing — the output is identical.
name: Update project index

on:
  push:
    paths:
      - 'projects/**'

permissions:
  contents: write

jobs:
  update-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Regenerate projects/index.txt
        run: |
          {
            echo "# Generated by the project-index workflow — do not edit by hand."
            echo "# Every .txt in projects/ except _template.txt and other _ files."
            for f in projects/*.txt; do
              base=$(basename "$f")
              case "$base" in
                _*|index.txt) continue ;;
              esac
              echo "$base"
            done
          } > projects/index.txt

      - name: Commit if it changed
        run: |
          if git diff --quiet -- projects/index.txt; then
            echo "Index already up to date."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add projects/index.txt
          git commit -m "Update project index"
          git push
